version: '3.9'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: coderoyale-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: coderoyale
      MYSQL_USER: ${DB_USER:-coderoyale}
      MYSQL_PASSWORD: ${DB_PASSWORD:-coderoyale}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db/migration/V1__init_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/src/main/resources/db/migration/V2__seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - coderoyale-net

  # Spring Boot Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coderoyale-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/coderoyale?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${DB_USER:-coderoyale}
      DB_PASSWORD: ${DB_PASSWORD:-coderoyale}
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      JWT_SECRET: ${JWT_SECRET:-CodeRoyaleUltraSecureQuantumSecretKeyForJwt2026EsportsBattleArena}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JUDGE0_API_URL: ${JUDGE0_API_URL:-}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    ports:
      - "8080:8080"
    networks:
      - coderoyale-net

  # Nginx Frontend Static Server
  frontend:
    image: nginx:alpine
    container_name: coderoyale-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - coderoyale-net

volumes:
  mysql_data:
    driver: local

networks:
  coderoyale-net:
    driver: bridge
