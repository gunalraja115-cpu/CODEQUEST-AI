# Production profile — MySQL, Flyway migrations, no H2 console
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/coderoyale?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USER:coderoyale}
    password: ${DB_PASSWORD:coderoyale}
    driver-class-name: com.mysql.cj.jdbc.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    root: WARN
    com.coderoyale: INFO
    org.springframework.security: WARN
